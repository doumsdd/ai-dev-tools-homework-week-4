[project]
name = "agent-relay"
version = "0.1.0"
description = "FastAPI application with OpenTelemetry instrumentation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-sdk",
]

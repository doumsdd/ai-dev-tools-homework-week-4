groups:
  - name: agent_relay_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_response_status_code_count{status_code=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreur HTTP 5xx élevé sur Agent Relay"
          description: "Plus de 5% des requêtes échouent. Impact utilisateur direct."
